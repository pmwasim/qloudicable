name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: cargo test

      - name: Build CLI
        run: cargo build --release -p qloudicable-cli

      - name: Run CLI on this Mac
        run: |
          target/release/qloudicable --version
          target/release/qloudicable
          target/release/qloudicable --json > report.json
          python3 -c 'import json; r = json.load(open("report.json"))["snapshot"]; print(r["platform"], len(r["ports"]), "ports,", len(r["usb_devices"]), "USB devices")'

      - name: Build app
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles app,dmg

      - name: Collect files
        run: |
          mkdir -p dist-out/macos
          cp target/release/bundle/dmg/*.dmg dist-out/macos/
          cp target/release/qloudicable dist-out/macos/qloudicable-cli-macos-arm64
          ls -lh dist-out/macos

      - uses: actions/upload-artifact@v4
        with:
          name: qloudicable-macos-arm64
          path: dist-out/macos/*
          retention-days: 14
