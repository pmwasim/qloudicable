# Builds every platform from a version tag and creates a draft GitHub release.
# Nothing reaches users until a person publishes the draft. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Work out the channel and check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Test build of $version: nothing will be published."
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          case "$tag" in
            *-beta.*) channel=beta ;;
            *-*) echo "Use vX.Y.Z or vX.Y.Z-beta.N" >&2; exit 1 ;;
            *) channel=stable ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      QLOUDICABLE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
            cli_name: qloudicable-cli-linux-x86_64
            cli_path: qloudicable
          - os: windows-latest
            bundles: nsis
            cli_name: qloudicable-cli-windows-x86_64.exe
            cli_path: qloudicable.exe
          - os: macos-latest
            bundles: app,dmg
            cli_name: qloudicable-cli-macos-arm64
            cli_path: qloudicable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Test
        run: cargo test --workspace
      - name: Build CLI
        run: cargo build --release -p qloudicable-cli
      - name: Check the CLI runs
        shell: bash
        run: |
          target/release/${{ matrix.cli_path }} --version
          target/release/${{ matrix.cli_path }} --json > /dev/null
      - name: Build app
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist-out
          cp target/release/${{ matrix.cli_path }} dist-out/${{ matrix.cli_name }}
          find target/release/bundle \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) -exec cp {} dist-out/ \;
          ls -lh dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist-out/*
          if-no-files-found: error
          retention-days: 14

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      QLOUDICABLE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install the NDK and Tauri CLI
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          cargo install tauri-cli --version "^2" --locked
      - name: Set up signing, when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/src-tauri/gen/android/app/release.keystore
            echo "$KEY_PROPERTIES" > app/src-tauri/gen/android/key.properties
          else
            echo "::warning::No signing secrets, so the Android build is unsigned."
          fi
      - name: Build
        # Google Play refuses a repeated version code, and betas share a version number.
        run: scripts/build-android.sh --config "{\"bundle\":{\"android\":{\"versionCode\":$((2000 + GITHUB_RUN_NUMBER))}}}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: dist-out/android/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [prepare, desktop, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          flags="--draft --generate-notes --verify-tag"
          [ "$CHANNEL" = beta ] && flags="$flags --prerelease"
          gh release create "$GITHUB_REF_NAME" artifacts/* $flags
