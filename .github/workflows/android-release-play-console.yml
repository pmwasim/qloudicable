name: Android Release & Play Console Upload

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Tauri CLI
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          cargo install tauri-cli --version "^2" --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Decode Android Keystore & Properties (if configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/src-tauri/gen/android/app/release.keystore
            echo "$KEY_PROPERTIES" > app/src-tauri/gen/android/key.properties
            echo "Configured automated release signing."
          fi

      - name: Build Android Bundle
        run: |
          # Google Play refuses a repeated version code.
          scripts/build-android.sh --config "{\"bundle\":{\"android\":{\"versionCode\":$((2000 + GITHUB_RUN_NUMBER))}}}"

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            dist-out/android/*.aab
            dist-out/android/*.apk

      - name: Upload to Google Play
        env:
          PLAY_CONSOLE_JSON_KEY: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
        run: |
          if [ -z "$PLAY_CONSOLE_JSON_KEY" ]; then
            echo "::warning::PLAY_CONSOLE_SERVICE_ACCOUNT_JSON isn't set, so nothing was uploaded."
            exit 0
          fi
          pip install google-api-python-client google-auth
          echo "$PLAY_CONSOLE_JSON_KEY" > /tmp/pc-key.json
          python3 scripts/play-console-automation.py --creds /tmp/pc-key.json --track "$TRACK" \
            release --aab "$(ls dist-out/android/*.aab | head -1)"
          rm -f /tmp/pc-key.json
